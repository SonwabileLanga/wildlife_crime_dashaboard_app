<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wildlife Crime Monitoring Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.7.1/leaflet.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.7.1/leaflet.js"></script>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body>
    <header>
        <h1>Wildlife Crime Monitoring Dashboard</h1>
        <p>Real-time monitoring of wildlife crime incidents across South Africa</p>
    </header>
    
    <main>
        <section id="alerts-section">
            <h2>Recent Alerts</h2>
            <div id="alerts"></div>
        </section>
        
        <section id="map-section">
            <h2>Incident Locations</h2>
            <div id="map"></div>
        </section>
        
        <section id="trends-section">
            <h2>Crime Trends</h2>
            <div id="crime-trends"></div>
        </section>
    </main>
    
    <footer>
        <p>&copy; 2024 Wildlife Crime Monitoring System</p>
    </footer>
    
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
